name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Detection tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate Sigma rules
        run: uv run sigma check --fail-on-issues rules/

      - name: Convert rules to Lucene
        run: uv run sigma convert -t lucene -p ecs_windows rules/
        