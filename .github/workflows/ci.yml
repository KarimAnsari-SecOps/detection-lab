name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Detection tests
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.10
        env: 
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xms1g
        ports:
          - 9200:9200
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate Sigma rules
        # attacktag: pySigma 1.5.x compares Sigma tactic tags (lateral_movement) against
        # STIX shortnames (lateral-movement), so every multi-word tactic is rejected.
        # d3_fendtag: unused here, and it downloads from d3fend.mitre.org each run.
        run: uv run sigma check --fail-on-issues -x attacktag -x d3_fendtag rules/

      - name: Convert rules to Lucene
        run: uv run sigma convert -t lucene -p ecs_windows rules/
      
      - name: Wait for Elasticsearch
        run: > 
          curl --silent --fail --retry 30 --retry-delay 3 --retry-all-errors
          "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s"